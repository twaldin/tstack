name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Unit tests and setup check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Setup into a temp HOME
        if: ${{ !cancelled() }}
        run: |
          HOME="$(mktemp -d)"
          export HOME
          trap 'rm -rf "$HOME"' EXIT
          python3 bin/tstack setup --machine ci
          test -f "$HOME/.omp/agent/skills/poteto-mode/omp.md"
          test -f "$HOME/.omp/agent/agents/poteto-agent.md"
          test -x "$HOME/.local/bin/lane"
