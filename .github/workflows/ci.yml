name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Unit tests and setup check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Bun for seat-waits runtime tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Setup into a temp HOME
        if: ${{ !cancelled() }}
        run: |
          HOME="$(mktemp -d)"
          export HOME
          trap 'rm -rf "$HOME"' EXIT
          python3 bin/tstack setup --machine ci
          test -f "$HOME/.omp/agent/skills/poteto-mode/omp.md"
          test -f "$HOME/.omp/agent/agents/poteto-agent.md"
          test -x "$HOME/.local/bin/lane"
          test -L "$HOME/.omp/agent/skills/ponytail"
          test -L "$HOME/.omp/agent/skills/ponytail-review"
          test -f "$HOME/.omp/agent/skills/ponytail/SKILL.md"
          test -f "$HOME/.omp/agent/skills/ponytail-review/SKILL.md"
          test -f "$HOME/worktrees/ponytail/main/LICENSE"
